services:
  mysql:
    image: mysql:8.4
    container_name: mysql-mahasiswa
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: Mahasiswa
      MYSQL_USER: mahasiswa_app
      MYSQL_PASSWORD: mahasiswa123
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
